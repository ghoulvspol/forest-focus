<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #000000;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* 背景大字 */
  .bg-text {
    position: absolute;
    font-size: 320px;
    font-weight: 800;
    color: rgba(255,255,255,0.02);
    letter-spacing: -10px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    user-select: none;
  }

  .content {
    text-align: center;
    z-index: 2;
    position: relative;
  }

  .closing-title {
    font-size: 88px;
    font-weight: 700;
    color: #F5F5F7;
    letter-spacing: -2px;
    line-height: 1.1;
    margin-bottom: 24px;
  }
  .closing-title .accent {
    color: #FF6900;
  }

  .closing-sub {
    font-size: 28px;
    font-weight: 300;
    color: #86868B;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 64px;
  }

  /* 价格信息 */
  .price-row {
    display: flex;
    gap: 80px;
    align-items: center;
    margin-bottom: 56px;
  }
  .price-item {
    text-align: center;
  }
  .price-label {
    font-size: 14px;
    font-weight: 500;
    color: #86868B;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .price-value {
    font-size: 40px;
    font-weight: 600;
    color: #F5F5F7;
    letter-spacing: -0.5px;
  }
  .price-value .currency {
    font-size: 24px;
    font-weight: 400;
    color: #FF6900;
  }

  /* CTA 按钮 */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 48px;
    border-radius: 100px;
    background: #FF6900;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-decoration: none;
    transition: transform 0.2s;
  }
  .cta:hover { transform: scale(1.02); }
  .cta svg {
    width: 18px; height: 18px;
  }

  /* Logo */
  .logo {
    position: absolute;
    bottom: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0.5;
  }
  .logo-mark {
    width: 32px; height: 32px;
    background: #FF6900;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .logo-text {
    font-size: 16px;
    font-weight: 500;
    color: #86868B;
    letter-spacing: 1px;
  }

  /* 光晕 */
  .glow-top {
    position: absolute;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 800px; height: 400px;
    background: radial-gradient(ellipse, rgba(255,105,0,0.06) 0%, transparent 70%);
    filter: blur(40px);
  }
</style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="bg-text">15 Ultra</div>

  <div class="content">
    <h2 class="closing-title">Ready for <span class="accent">Tomorrow</span></h2>
    <p class="closing-sub">影像旗舰 · 为创作者而生</p>

    <div class="price-row">
      <div class="price-item">
        <div class="price-label">起售价</div>
        <div class="price-value"><span class="currency">¥</span>5,999</div>
      </div>
      <div class="price-item">
        <div class="price-label">预约</div>
        <div class="price-value">现已开启</div>
      </div>
    </div>

    <a class="cta" href="#">
      了解更多
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

  <div class="logo">
    <div class="logo-mark">MI</div>
    <div class="logo-text">xiaomi.com</div>
  </div>
</body>
</html>
