<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #FFFFFF;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex;
    position: relative;
  }

  /* 左侧内容 */
  .left {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 100px;
  }
  .section-label {
    font-size: 15px;
    font-weight: 600;
    color: #FF6900;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 68px;
    font-weight: 700;
    color: #1D1D1F;
    letter-spacing: -1.5px;
    line-height: 1.15;
    margin-bottom: 28px;
  }
  .section-desc {
    font-size: 20px;
    font-weight: 300;
    color: #86868B;
    line-height: 1.8;
    max-width: 500px;
  }

  /* 材质标签 */
  .materials {
    display: flex;
    gap: 16px;
    margin-top: 48px;
    flex-wrap: wrap;
  }
  .material-tag {
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.5px;
    border: 1.5px solid #E8E8ED;
    color: #1D1D1F;
    background: #FAFAFA;
    transition: all 0.3s;
  }

  /* 右侧 - 手机轮廓 */
  .right {
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .phone-silhouette {
    width: 320px;
    height: 660px;
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.08);
  }
  .phone-body {
    width: 100%;
    height: 100%;
    border-radius: 40px;
    border: 2px solid rgba(0,0,0,0.08);
    background: linear-gradient(160deg, #f8f8f8 0%, #e8e8e8 30%, #d4d4d4 60%, #c0c0c0 100%);
    position: relative;
  }
  .phone-body::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, transparent 50%);
    border-radius: 40px;
  }
  .phone-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 32px;
    background: #000;
    border-radius: 16px;
  }

  /* 陶瓷材质渐变 */
  .phone-ceramic {
    background: linear-gradient(160deg, #2c2c2e 0%, #1c1c1e 40%, #0a0a0a 100%);
    border-color: rgba(255,255,255,0.08);
  }
  .phone-ceramic::before {
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 40%);
  }

  /* 背景装饰 */
  .bg-grid {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="section-label">Design</div>
    <h2 class="section-title">精密陶瓷<br>旗舰质感</h2>
    <p class="section-desc">
      高端纳米微晶陶瓷后盖，温润如玉的触感。
      铝合金中框一体成型，IP68 级防尘防水。
      每一处细节，都经得起时间考验。
    </p>
    <div class="materials">
      <div class="material-tag">纳米微晶陶瓷</div>
      <div class="material-tag">钛合金中框</div>
      <div class="material-tag">IP68 防水</div>
      <div class="material-tag">Gorilla Glass Victus 2</div>
    </div>
  </div>
  <div class="right">
    <div class="bg-grid"></div>
    <div class="phone-silhouette">
      <div class="phone-body phone-ceramic">
        <div class="phone-notch"></div>
      </div>
    </div>
  </div>
</body>
</html>
