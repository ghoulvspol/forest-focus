<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #000000;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex;
    position: relative;
  }

  /* 左侧内容区 */
  .left {
    width: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 100px;
  }
  .section-label {
    font-size: 15px;
    font-weight: 600;
    color: #FF6900;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 72px;
    font-weight: 700;
    color: #F5F5F7;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 20px;
  }
  .section-desc {
    font-size: 22px;
    font-weight: 300;
    color: #86868B;
    line-height: 1.7;
    max-width: 480px;
  }

  /* 参数卡片 */
  .specs {
    display: flex;
    gap: 40px;
    margin-top: 56px;
  }
  .spec-item {
    display: flex;
    flex-direction: column;
  }
  .spec-value {
    font-size: 56px;
    font-weight: 700;
    color: #F5F5F7;
    letter-spacing: -1px;
    line-height: 1;
  }
  .spec-value span {
    font-size: 28px;
    font-weight: 400;
    color: #FF6900;
  }
  .spec-label {
    font-size: 14px;
    font-weight: 500;
    color: #86868B;
    margin-top: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* 右侧 - 镜头模块视觉 */
  .right {
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 镜头组 - 几何设计元素 */
  .camera-module {
    position: relative;
    width: 400px; height: 400px;
  }
  .lens {
    position: absolute;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .lens::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,105,0,0.3) 0%, rgba(255,105,0,0.05) 50%, transparent 70%);
  }
  .lens-1 {
    width: 180px; height: 180px;
    top: 0; left: 0;
  }
  .lens-1::after { width: 100px; height: 100px; }
  .lens-2 {
    width: 140px; height: 140px;
    top: 10px; right: 0;
  }
  .lens-2::after { width: 80px; height: 80px; }
  .lens-3 {
    width: 100px; height: 100px;
    bottom: 40px; left: 30px;
  }
  .lens-3::after { width: 56px; height: 56px; }
  .lens-4 {
    width: 60px; height: 60px;
    bottom: 80px; right: 60px;
    border-color: rgba(255,105,0,0.4);
  }
  .lens-4::after { width: 32px; height: 32px; }

  /* Leica 标识 */
  .leica-badge {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: 600;
    color: #FF6900;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  /* 背景光晕 */
  .glow {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,105,0,0.08) 0%, transparent 60%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
  <div class="left">
    <div class="section-label">Camera System</div>
    <h2 class="section-title">徕卡光学<br>四摄系统</h2>
    <p class="section-desc">1 英寸主摄传感器，配合徕卡 Summilux 镜头，从广角到长焦，每一帧都是大师之作。</p>
    <div class="specs">
      <div class="spec-item">
        <div class="spec-value">50<span>MP</span></div>
        <div class="spec-label">主摄</div>
      </div>
      <div class="spec-item">
        <div class="spec-value">1<span>"</span></div>
        <div class="spec-label">传感器</div>
      </div>
      <div class="spec-item">
        <div class="spec-value">120<span>x</span></div>
        <div class="spec-label">变焦</div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="glow"></div>
    <div class="camera-module">
      <div class="lens lens-1"></div>
      <div class="lens lens-2"></div>
      <div class="lens lens-3"></div>
      <div class="lens lens-4"></div>
      <div class="leica-badge">Leica Summilux</div>
    </div>
  </div>
</body>
</html>
