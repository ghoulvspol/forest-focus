<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #000000;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex;
    position: relative;
  }

  /* 左侧 - 屏幕视觉 */
  .left {
    width: 55%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 屏幕模拟 */
  .screen-frame {
    width: 380px;
    height: 760px;
    border-radius: 44px;
    border: 4px solid rgba(255,255,255,0.12);
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6);
  }
  .screen-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px;
    height: 36px;
    background: #000;
    border-radius: 20px;
  }
  .screen-content {
    padding: 60px 24px 24px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .screen-time {
    font-size: 72px;
    font-weight: 200;
    color: #F5F5F7;
    letter-spacing: -2px;
  }
  .screen-date {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* 屏幕光效 */
  .screen-glow {
    position: absolute;
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,105,0,0.1) 0%, transparent 60%);
    filter: blur(60px);
  }

  /* 右侧内容 */
  .right {
    width: 45%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 80px;
  }
  .section-label {
    font-size: 15px;
    font-weight: 600;
    color: #FF6900;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 64px;
    font-weight: 700;
    color: #F5F5F7;
    letter-spacing: -1.5px;
    line-height: 1.15;
    margin-bottom: 28px;
  }

  /* 参数列表 */
  .spec-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .spec-list li {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .spec-list li:last-child { border-bottom: none; }
  .spec-key {
    font-size: 14px;
    font-weight: 500;
    color: #86868B;
    min-width: 80px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .spec-val {
    font-size: 22px;
    font-weight: 600;
    color: #F5F5F7;
    letter-spacing: 0.3px;
  }
  .spec-val .highlight {
    color: #FF6900;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="screen-glow"></div>
    <div class="screen-frame">
      <div class="screen-notch"></div>
      <div class="screen-content">
        <div class="screen-time">9:41</div>
        <div class="screen-date">Thursday, April 30</div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="section-label">Display</div>
    <h2 class="section-title">2K 超视感屏<br>旗舰新标杆</h2>
    <ul class="spec-list">
      <li>
        <span class="spec-key">面板</span>
        <span class="spec-val"><span class="highlight">LTPO AMOLED</span> · 第二代</span>
      </li>
      <li>
        <span class="spec-key">分辨率</span>
        <span class="spec-val">3200 × 1440 · <span class="highlight">2K</span></span>
      </li>
      <li>
        <span class="spec-key">刷新率</span>
        <span class="spec-val">1 ~ <span class="highlight">120Hz</span> 自适应</span>
      </li>
      <li>
        <span class="spec-key">亮度</span>
        <span class="spec-val">峰值 <span class="highlight">3200 nits</span></span>
      </li>
      <li>
        <span class="spec-key">护眼</span>
        <span class="spec-val">DC 调光 · 低蓝光认证</span>
      </li>
    </ul>
  </div>
</body>
</html>
