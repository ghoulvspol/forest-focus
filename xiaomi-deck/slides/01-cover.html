<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #FFFFFF;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* 小米 Logo - 极简 MI 字标 */
  .logo {
    position: absolute;
    top: 64px; left: 80px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo-mark {
    width: 44px; height: 44px;
    background: #FF6900;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
    letter-spacing: -0.5px;
  }
  .logo-text {
    font-size: 22px; font-weight: 600; color: #1D1D1F;
    letter-spacing: 0.5px;
  }

  /* 主内容 */
  .content {
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .hero-title {
    font-size: 148px;
    font-weight: 700;
    color: #1D1D1F;
    letter-spacing: -4px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .hero-title span {
    color: #FF6900;
  }
  .hero-sub {
    font-size: 52px;
    font-weight: 300;
    color: #86868B;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-top: 20px;
  }
  .hero-tagline {
    font-size: 28px;
    font-weight: 400;
    color: #1D1D1F;
    margin-top: 48px;
    letter-spacing: 0.3px;
    opacity: 0.7;
  }

  /* 装饰线 */
  .accent-line {
    width: 80px; height: 4px;
    background: #FF6900;
    margin: 36px auto 0;
    border-radius: 2px;
  }

  /* 背景装饰圆 */
  .bg-circle {
    position: absolute;
    width: 680px; height: 680px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,105,0,0.04) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  /* 右下角日期 */
  .date {
    position: absolute;
    bottom: 48px; right: 80px;
    font-size: 16px; color: #86868B;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="bg-circle"></div>
  <div class="logo">
    <div class="logo-mark">MI</div>
    <div class="logo-text">Xiaomi</div>
  </div>
  <div class="content">
    <h1 class="hero-title">15 <span>Ultra</span></h1>
    <div class="accent-line"></div>
    <p class="hero-sub">A New Era</p>
    <p class="hero-tagline">影像旗舰，为创作者而生</p>
  </div>
  <div class="date">2025</div>
</body>
</html>
