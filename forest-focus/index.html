<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Forest 专注森林</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <nav id="nav">
      <div class="nav-left" id="navBack" style="display:none">← 返回</div>
      <div class="nav-title">🌱 专注森林</div>
      <div class="nav-right">
        <span id="navForest" class="nav-icon">🌳</span>
        <span id="navStats" class="nav-icon">📊</span>
      </div>
    </nav>

    <!-- 页面容器 -->
    <div id="pages">

      <!-- 首页：选择时长 + 种子 -->
      <div id="pageHome" class="page active">
        <div class="home-hero">
          <div class="hero-emoji">🌱</div>
          <h1>种下一颗种子</h1>
          <p class="hero-sub">专注的时间越长，它长得越大</p>
        </div>

        <!-- 剩余免费次数 -->
        <div id="freeCounter" class="free-counter"></div>

        <!-- 时长选择 -->
        <div class="section">
          <h3>选择专注时长</h3>
          <div class="duration-grid" id="durationGrid">
            <button class="duration-btn" data-minutes="15">15分钟</button>
            <button class="duration-btn active" data-minutes="25">25分钟</button>
            <button class="duration-btn" data-minutes="45">45分钟</button>
            <button class="duration-btn" data-minutes="60">60分钟</button>
          </div>
        </div>

        <!-- 种子选择 -->
        <div class="section">
          <h3>选择一颗种子</h3>
          <div class="seed-grid" id="seedGrid"></div>
        </div>

        <!-- 承诺输入 -->
        <div class="section">
          <h3>写下承诺（可选）</h3>
          <input type="text" id="promiseInput" class="promise-input" placeholder="接下来我要完成____" maxlength="50">
        </div>

        <!-- 开始按钮 -->
        <button id="startBtn" class="start-btn">🌱 开始专注</button>
      </div>

      <!-- 专注页：计时 + 生长动画 -->
      <div id="pageFocus" class="page">
        <div class="focus-container">
          <div id="promiseDisplay" class="promise-display"></div>
          <canvas id="treeCanvas" width="400" height="500"></canvas>
          <div id="waitingMsg" class="waiting-msg" style="display:none">
            <span>🌱 我在等你回来...</span>
          </div>
          <div class="timer-display">
            <span id="timerMinutes">25</span>:<span id="timerSeconds">00</span>
          </div>
          <div class="timer-progress">
            <div id="timerProgressBar" class="timer-progress-bar"></div>
          </div>
          <div class="focus-actions">
            <button id="giveupBtn" class="btn-giveup">放弃</button>
            <button id="pauseBtn" class="btn-pause">暂停</button>
          </div>
        </div>
      </div>

      <!-- 完成页：结果展示 -->
      <div id="pageComplete" class="page">
        <div class="complete-container">
          <div class="complete-emoji">🌳</div>
          <h2 id="completeTitle">你的树长大了！</h2>
          <div class="complete-stats">
            <div class="stat-item">
              <div class="stat-value" id="completeDuration">25</div>
              <div class="stat-label">专注分钟</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="completePromise">-</div>
              <div class="stat-label">承诺状态</div>
            </div>
          </div>
          <canvas id="completeTreeCanvas" width="200" height="250"></canvas>
          <div class="complete-actions">
            <button id="saveForestBtn" class="btn-primary">🌳 存入森林</button>
            <button id="againBtn" class="btn-secondary">🔄 再来一轮</button>
            <button id="viewForestBtn" class="btn-link">查看我的森林 →</button>
          </div>
        </div>
      </div>

      <!-- 森林页 -->
      <div id="pageForest" class="page">
        <div class="forest-header">
          <h2>🌳 我的森林</h2>
          <div class="forest-summary">
            <span id="forestTotalTrees">0</span> 棵树 ·
            <span id="forestTotalHours">0</span> 小时
          </div>
        </div>
        <div id="forestGrid" class="forest-grid"></div>
        <div id="forestEmpty" class="forest-empty" style="display:none">
          <div class="empty-emoji">🌱</div>
          <p>还没有种下任何树</p>
          <p>去专注一次吧！</p>
        </div>
      </div>

      <!-- 统计页 -->
      <div id="pageStats" class="page">
        <h2>📊 专注数据</h2>
        <div class="stats-cards">
          <div class="stats-card">
            <div class="stats-card-value" id="statsTotalTrees">0</div>
            <div class="stats-card-label">总树木</div>
          </div>
          <div class="stats-card">
            <div class="stats-card-value" id="statsTotalHours">0</div>
            <div class="stats-card-label">总小时</div>
          </div>
          <div class="stats-card">
            <div class="stats-card-value" id="statsStreak">0</div>
            <div class="stats-card-label">连续天数</div>
          </div>
          <div class="stats-card">
            <div class="stats-card-value" id="statsLongest">0</div>
            <div class="stats-card-label">最长专注(分)</div>
          </div>
        </div>

        <div class="stats-section">
          <h3>今日</h3>
          <div class="today-summary">
            <span id="statsTodayCount">0</span> 次专注 ·
            <span id="statsTodayMinutes">0</span> 分钟
          </div>
        </div>

        <div class="stats-section">
          <h3>本周</h3>
          <div class="week-chart" id="weekChart"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/forest.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
